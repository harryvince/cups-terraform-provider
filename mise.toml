[settings]
lockfile = true

[vars]
# CI reads its mise bootstrap version here before installing project tools.
mise_version = "2026.9.13"

[tools]
go = "1.27.1"
terraform = "1.16.4"
goreleaser = "2.18.2"
node = "26.10.0"
"npm:commit-and-tag-version" = "13.2.1"
actionlint = "1.7.12"
gh = "2.101.0"
"docker-compose" = "5.5.1"

[tasks.setup]
description = "Install only this project’s locked tools"
run = "mise install --locked go terraform goreleaser node npm:commit-and-tag-version actionlint gh docker-compose"

[tasks.build]
description = "Build the local provider"
run = "go build -o bin/terraform-provider-cups ."

[tasks.fmt]
description = "Format Go and Terraform examples"
run = ["gofmt -w main.go internal", "terraform fmt -recursive examples"]

[tasks."fmt:check"]
description = "Check Go and Terraform formatting"
run = ["test -z \"$(gofmt -l main.go internal)\"", "terraform fmt -check -recursive examples"]

[tasks.test]
description = "Run unit and protocol tests"
run = "go test ./..."

[tasks."test:race"]
description = "Run unit and protocol tests with the race detector"
run = "go test -race -timeout=2m ./..."

[tasks.vet]
description = "Run Go vet"
run = "go vet ./..."

[tasks.lint]
description = "Check GitHub Actions workflows and release configuration"
run = ["actionlint", "goreleaser check"]

[tasks.check]
description = "Run the checks used by CI"
run = ["mise run fmt:check", "go mod verify", "mise run test:race", "mise run vet", "mise run build", "mise run lint"]

[tasks."testenv:up"]
description = "Build and start disposable CUPS"
run = "docker-compose up --build --wait --wait-timeout 120"

[tasks."testenv:down"]
description = "Remove disposable CUPS and its state"
run = "docker-compose down"

[tasks."testenv:smoke"]
description = "Check the running disposable CUPS fixture"
run = "docker-compose exec -T cups python3 /opt/testenv/smoke.py"

[tasks."test:acc"]
description = "Run Terraform acceptance tests against an explicitly selected fixture"
env = { CUPS_ACC = "1" }
run = "go test -v -count=1 -timeout=10m ./internal/provider -run TestAcceptance"

[tasks.acceptance]
description = "Start, test, and remove the disposable CUPS fixture"
run = "scripts/acceptance.sh"

[tasks."release:preview"]
description = "Preview the next version and changelog without changing files or tags"
run = "commit-and-tag-version --dry-run"

[tasks."release:prepare"]
description = "Generate the changelog, release commit, and local tag (does not push)"
run = "scripts/prepare-release.sh"

[tasks."release:snapshot"]
description = "Build unsigned release archives without publishing"
run = "goreleaser release --snapshot --clean --skip=publish,sign"

[tasks."release:publish"]
description = "Build and sign the current version tag in CI, publishing its GitHub Release"
run = "goreleaser release --clean"
