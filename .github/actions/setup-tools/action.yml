name: Set up project tools
description: Read tool versions from mise configuration
runs:
  using: composite
  steps:
    - name: Read mise version
      id: mise-version
      shell: bash
      run: |
        python3 - <<'PY'
        import os, tomllib
        with open('mise.toml', 'rb') as config:
            version = tomllib.load(config)['vars']['mise_version']
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f'version={version}\n')
        PY
    - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      with:
        version: ${{ steps.mise-version.outputs.version }}
