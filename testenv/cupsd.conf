# Disposable test server only. Basic auth over HTTP is intentional here.
ServerName cups
ServerAlias localhost 127.0.0.1
Listen 0.0.0.0:631
Listen /run/cups/cups.sock
Browsing Off
BrowseLocalProtocols none
WebInterface Yes
DefaultShared No
DefaultAuthType Basic
DefaultEncryption Never
LogLevel info
AccessLog /dev/stdout
ErrorLog /dev/stderr
PageLog /dev/stdout
MaxLogSize 0

<Location />
  Order allow,deny
  Allow all
</Location>

<Location /admin>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow all
</Location>

<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow all
</Location>

<Policy default>
  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices Set-Printer-Attributes Pause-Printer Resume-Printer CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>
  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
